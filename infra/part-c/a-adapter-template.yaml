AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Conector opcional que despliega Kiara junto a sus tablas. No crea ni reemplaza tablas de negocio.
Parameters:
  LambdaRoleArn: {Type: String}
  MachinesTable: {Type: String}
  IncidentsTable: {Type: String}
  TechniciansTable: {Type: String}
  InventoryTable: {Type: String}
  AlertsTable: {Type: String}
  TelemetryTable: {Type: String}
Resources:
  Commands:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  Adapter:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: ../../part-c/backend/
      Handler: afc.a_adapter.handler
      Timeout: 60
      MemorySize: 256
      Role: !Ref LambdaRoleArn
      Environment:
        Variables:
          MACHINES_TABLE: !Ref MachinesTable
          INCIDENTS_TABLE: !Ref IncidentsTable
          TECHNICIANS_TABLE: !Ref TechniciansTable
          INVENTORY_TABLE: !Ref InventoryTable
          ALERTS_TABLE: !Ref AlertsTable
          TELEMETRY_TABLE: !Ref TelemetryTable
          C_COMMANDS_TABLE: !Ref Commands
Outputs:
  AdapterArn: {Value: !GetAtt Adapter.Arn}
